# Trusted Publishing to npm via OIDC — no long-lived tokens.
#
# Trigger: push a tag like v0.2.1. The workflow verifies the tag matches
# package.json, runs the full verification suite, then publishes with
# --provenance (requires the trusted publisher to be configured once at
# https://www.npmjs.com/package/tracereel/access -> "Trusted Publisher").
name: publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.14"
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm and verify toolchain
        run: |
          npm install -g npm@^11.15.0
          node --version
          npm --version

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Publishing tracereel@$PKG_VERSION"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - run: npm publish --provenance --access public
