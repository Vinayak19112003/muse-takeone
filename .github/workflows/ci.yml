name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: typecheck, test, build, smoke render
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20.x", "22.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Verify generated scrollplan.inline.ts is in sync with scrollplan.ts.
      # The prebuild hook regenerates it, but CI must fail if a developer
      # changed scrollplan.ts without committing the regenerated output.
      - run: |
          npm run scrollplan:inline
          git diff --exit-code src/compositor/scrollplan.inline.ts || (echo "ERROR: src/compositor/scrollplan.inline.ts is stale. Run 'npm run scrollplan:inline' and commit the result." && exit 1)
      - run: npm run build
      # Smoke render: the smallest visual fixture at 640x360@15fps through the
      # real compositor Chromium. Catches render-pipeline breakage (compositor,
      # ffmpeg, manifest bugs) that unit tests cannot. ~10s on a CI runner.
      - run: npx playwright install --with-deps chromium
      - run: |
          node dist/cli.js reconstruct tests/fixtures/visual/form/input.json \
            -o smoke.mp4 --width 640 --height 360 --fps 15 --no-contact-sheet
          test -s smoke.mp4 && ls -la smoke.mp4

# Visual regression (`npm run visual-qa`) is intentionally NOT in CI: it needs
# a real Chromium renderer and produces contact-sheet diffs that a maintainer
# must review by eye. Run it locally before pushing rendering changes.
